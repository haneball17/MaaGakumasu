[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MaaGakumasu"
version = "1.3.8"
description = "学園アイドルマスター(学マス)小助手 | Assistant For Gakuen Idolmaster"
readme = "README.md"
license = {text = "AGPL-3.0 license"}
requires-python = ">=3.12"
authors = [
    {name = "SuperWaterGod"}
]
keywords = ["maa", "maaframework", "gakumas", "automation", "image-recognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games",
]

dependencies = [
    # maafw 5.12.x IPC 存在日文 expected UTF-8→GBK 乱码回归(実機 2026-08-20:
    # AgentClient 反向 run_recognition 收到乱码正则致 OCR 全 miss),锁 5.11.x
    # 直至上游修复;乱码证据见 debug/autodev/ 会话报告
    "maafw>=5.11.1,<5.12",
    "loguru",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/SuperWaterGod/MaaGakumasu"
Repository = "https://github.com/SuperWaterGod/MaaGakumasu"
Issues = "https://github.com/SuperWaterGod/MaaGakumasu/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    # 无人化管线开发工具链（pipeline-autodev）。maa-mcp 为 AGPL-3.0，仅作开发期
    # 工具使用（设备控制/OCR/pipeline 运行），不打包进发布产物。
    "maa-mcp>=1.2.3",
    "MaaDebugger>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.ruff]
select = ["I"]
line-length = 144 
target-version = "py312"

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true

[tool.pytest.ini_options]
testpaths = ["tests"]
